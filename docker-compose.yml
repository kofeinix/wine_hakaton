name: wine_hakaton

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wine_hakaton_frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://app:8000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./data:/data:ro

  postgres:
    image: postgres:16-alpine
    container_name: wine_hakaton_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE__DB_NAME:-wine_hakaton}
      POSTGRES_USER: ${DATABASE__USER:-wine}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-wine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE__PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USER:-wine} -d ${DATABASE__DB_NAME:-wine_hakaton}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_db_init
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE__HOST: postgres
      DATABASE__PORT: 5432
      DATABASE__DB_NAME: ${DATABASE__DB_NAME:-wine_hakaton}
      DATABASE__USER: ${DATABASE__USER:-wine}
      DATABASE__PASSWORD: ${DATABASE__PASSWORD:-wine}
    volumes:
      - ./data:/data:ro
    command:
      - python
      - scripts/init_database.py
      - --db-dir
      - /data/db

  minio:
    image: minio/minio:latest
    container_name: wine_hakaton_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO__ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO__SECRET_KEY:-miniosecret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO__PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: wine_hakaton_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO__HOST: minio
      MINIO__PORT:  ${MINIO__PORT:-9000}
      MINIO__ACCESS_KEY: ${MINIO__ACCESS_KEY:-minio}
      MINIO__SECRET_KEY: ${MINIO__SECRET_KEY:-miniosecret}
      MINIO__BUCKET: ${MINIO__BUCKET:-wine}
      MINIO__VERIFY_SSL: "false"
      MINIO_SEED_ARCHIVE: /data/photos.tar.gz
    volumes:
      - ./data/photos.tar.gz:/data/photos.tar.gz:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO__ACCESS_KEY" "$$MINIO__SECRET_KEY"
        mc mb --ignore-existing "local/$$MINIO__BUCKET"
        mc rm --recursive --force "local/$$MINIO__BUCKET" >/dev/null
        mc cp --disable-multipart \
          --attr "X-Amz-Meta-Snowball-Auto-Extract=true" \
          "$$MINIO_SEED_ARCHIVE" "local/$$MINIO__BUCKET/" >/dev/null
        echo "MinIO bucket '$$MINIO__BUCKET' is ready with seeded photos."

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wine_hakaton_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT__PORT:-6333}:6333"
      - "${QDRANT__GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_qdrant_init
    restart: "no"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT__HOST: qdrant
      QDRANT__PORT: ${QDRANT__PORT:-6333}
      QDRANT__GRPC_PORT: ${QDRANT__GRPC_PORT:-6334}
      QDRANT__COLLECTION_NAME: ${QDRANT__COLLECTION_NAME:-wine_vectors}
      QDRANT__API_KEY: ${QDRANT__API_KEY:-}
    volumes:
      - ./data:/data:ro
    command:
      - python
      - scripts/init_qdrant.py
      - --embeddings-path
      - /data/embeddings/wine_siglip2.jsonl.gz

  redis:
    image: redis:7-alpine
    container_name: wine_hakaton_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS__PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
  qdrant_data:
  redis_data:
