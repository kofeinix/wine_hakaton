name: wine_hakaton

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wine_hakaton_frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://app:8000
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-}
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    # node_modules живёт в именованном томе и перекрывает установку из образа:
    # после смены package.json том устаревает, поэтому досинхронизируем зависимости при старте
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_app
    restart: unless-stopped
    env_file:
      - .env
    # адреса сервисов внутри docker-сети фиксированы: порты в .env меняют только проброс на хост
    environment: &internal-services
      DATABASE__HOST: postgres
      DATABASE__PORT: 5432
      QDRANT__HOST: qdrant
      QDRANT__PORT: 6333
      QDRANT__GRPC_PORT: 6334
      MINIO__HOST: minio
      MINIO__PORT: 9000
      REDIS__HOST: redis
      REDIS__PORT: 6379
    # LLM (LM Studio / Ollama) запущена на хосте; на Linux имя host.docker.internal нужно задать явно
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      models-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      qdrant-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./models:/models:ro
      - ./data:/data:ro

  # разовые сервисы подготовки: скачивают то, чего нет в репозитории; повторно — пропускают
  models-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_models_init
    restart: "no"
    user: root  # пишет в ./models на хосте (на Linux владелец папки может быть любым)
    volumes:
      - ./models:/models
    command: ["python", "scripts/prepare_models.py", "--model-root", "/models"]

  data-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_data_init
    restart: "no"
    user: root
    volumes:
      - ./data:/app/data
    command: ["python", "scripts/download_data.py", "--data-dir", "/app/data"]

  postgres:
    image: postgres:16-alpine
    container_name: wine_hakaton_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE__DB_NAME:-wine_hakaton}
      POSTGRES_USER: ${DATABASE__USER:-wine}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-wine}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE__PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE__USER:-wine} -d ${DATABASE__DB_NAME:-wine_hakaton}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_db_init
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment: *internal-services
    volumes:
      - ./data:/data:ro
    command:
      - python
      - scripts/init_database.py
      - --db-dir
      - /data/db
      # каталог приводится к data/db/*.json; пользователи, история, избранное не трогаются
      - --prune

  minio:
    # официальные образы MinIO (Docker Hub, quay.io) больше не отдаются без входа;
    # pgsty — community-сборки MinIO и mc (проект Pigsty), amd64 и arm64
    image: pgsty/minio:latest
    container_name: wine_hakaton_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO__ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO__SECRET_KEY:-miniosecret}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO__PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: pgsty/mc:latest
    container_name: wine_hakaton_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    environment:
      MINIO__ACCESS_KEY: ${MINIO__ACCESS_KEY:-minio}
      MINIO__SECRET_KEY: ${MINIO__SECRET_KEY:-miniosecret}
      MINIO__BUCKET: ${MINIO__BUCKET:-wine}
      # архив собирает scripts/build_photos_archive.py (или скачайте готовый в ./data/)
      MINIO_SEED_ARCHIVE: /seed/photos.tar.gz
      # 1 — перезалить bucket из архива, даже если он уже заполнен
      MINIO_RESEED: ${MINIO_RESEED:-0}
      # как часто писать в лог прогресс распаковки, секунд
      MINIO_PROGRESS_SECONDS: ${MINIO_PROGRESS_SECONDS:-15}
    volumes:
      - ./data:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        log() { echo "[minio-init $$(date +%H:%M:%S)] $$*"; }
        count_photos() { mc ls --recursive "local/$$MINIO__BUCKET" 2>/dev/null | wc -l | tr -d ' '; }

        log "connecting to MinIO at http://minio:9000, bucket '$$MINIO__BUCKET'"
        mc alias set local http://minio:9000 "$$MINIO__ACCESS_KEY" "$$MINIO__SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$MINIO__BUCKET" >/dev/null
        existing=$$(count_photos)
        if [ "$$existing" -gt 0 ] && [ "$$MINIO_RESEED" != "1" ]; then
          log "bucket already has $$existing photos; skipping seed (MINIO_RESEED=1 to reseed)"
          exit 0
        fi
        if [ ! -f "$$MINIO_SEED_ARCHIVE" ]; then
          log "WARNING: data/photos.tar.gz not found: bucket stays empty, wine photos will 404"
          log "put photos.tar.gz into ./data/ (or run scripts/build_photos_archive.py) and rerun: docker compose up minio-init"
          exit 0
        fi
        if [ "$$existing" -gt 0 ]; then
          log "MINIO_RESEED=1: removing $$existing existing photos"
          mc rm --recursive --force "local/$$MINIO__BUCKET" >/dev/null 2>&1 || true
        fi

        log "archive: $$MINIO_SEED_ARCHIVE, $$(numfmt --to=iec --suffix=B "$$(stat -c %s "$$MINIO_SEED_ARCHIVE")")"
        log "uploading with auto-extract: MinIO unpacks photos while receiving the archive"
        log "a ~5 GB archive takes several minutes; progress every $${MINIO_PROGRESS_SECONDS}s"
        started=$$(date +%s)
        # фоновый отчёт: сколько фото уже распаковано в bucket
        (
          while sleep "$$MINIO_PROGRESS_SECONDS"; do
            log "  ... $$(count_photos) photos in bucket, $$(( $$(date +%s) - started ))s elapsed"
          done
        ) &
        reporter=$$!
        if ! mc cp --disable-multipart \
          --attr "X-Amz-Meta-Snowball-Auto-Extract=true" \
          "$$MINIO_SEED_ARCHIVE" "local/$$MINIO__BUCKET/" >/tmp/mc-cp.log 2>&1; then
          kill "$$reporter" 2>/dev/null || true
          log "ERROR: upload failed after $$(( $$(date +%s) - started ))s, mc output:"
          cat /tmp/mc-cp.log
          log "partially seeded: $$(count_photos) photos; fix the cause and rerun with MINIO_RESEED=1"
          exit 1
        fi
        kill "$$reporter" 2>/dev/null || true
        log "done: bucket seeded with $$(count_photos) photos in $$(( $$(date +%s) - started ))s"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wine_hakaton_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT__PORT:-6333}:6333"
      - "${QDRANT__GRPC_PORT:-6334}:6334"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wine_hakaton_qdrant_init
    restart: "no"
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
    environment: *internal-services
    volumes:
      - ./data:/data:ro
    # коллекции уже загружены -> пропускает; перезалить: docker compose run --rm qdrant-init python scripts/init_qdrant.py --recreate
    command:
      - python
      - scripts/init_qdrant.py
      - --embeddings-dir
      - /data/embeddings

  redis:
    image: redis:7-alpine
    container_name: wine_hakaton_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS__PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  frontend_node_modules:
  postgres_data:
  minio_data:
  qdrant_data:
  redis_data:
