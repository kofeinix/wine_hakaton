[project]
name = "winehakaton"
version = "0.1.0"
description = "Сканер вин: поиск российского вина по фото этикетки"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "asyncpg>=0.31.0",
    "fastapi>=0.125.0",
    "httpx-retries>=0.6.0",
    "huggingface-hub>=1.2.3",
    "langchain-openai>=1.6.1",
    "miniopy-async>=1.23.5",
    "numpy>=2.4.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.19.0",
    "redis-rate-limiters>=0.5.0",
    "safetensors>=0.8.0",
    "sqlalchemy>=2.0.52",
    "tenacity>=9.1.4",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.38.0",
    "greenlet>=3.5.5",
    "torchvision>=0.29.0",
    "ultralytics>=8.4.153",
    "rapidfuzz>=3.14.6",
    "transliterate>=1.10.2",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "structlog>=25.4",
    "pi-heif>=1.1",
    "openvino>=2025.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
